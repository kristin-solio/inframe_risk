services:
  - type: web
    name: inframe-general-contractor-insurance
    runtime: static
    # Nothing to build. The page is a single self-contained HTML file.
    buildCommand: echo "no build step"
    staticPublishPath: .
    headers:
      # Belt and braces alongside the noindex meta tag. This is unapproved
      # client copy on a publicly reachable URL.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
